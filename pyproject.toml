[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeeval"
version = "0.1.0"
description = "Production ML benchmark and adversarial evaluation platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "docker>=7.1",
    "pytest>=8.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "agent*", "grader*", "runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "S110"]
